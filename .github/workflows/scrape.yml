name: moco-timeslots

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scrape.js
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SECRET: ${{ secrets.SECRET }}
          DATES: ${{ secrets.DATES }}
